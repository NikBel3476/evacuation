[package]
name = "evacuation"
version = "0.1.0"
description = "A Tauri App"
authors = [""]
license = ""
repository = ""
default-run = "evacuation"
edition = "2021"
rust-version = "1.77"

[lib]
name = "evacuation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0-beta.13", features = [] }

[dependencies]
serde_json = "1.0.116"
tauri = { version = "2.0.0-beta.17", features = [] }
tauri-plugin-dialog = "2.0.0-beta.3"
tauri-plugin-fs = "2.0.0-beta.7"
pyo3 = { version = "0.18.3", features = ["auto-initialize"] }
evacuation-core = { git = "https://github.com/NikBel3476/evacuation-core.git", rev = "db74447" }

[dev-dependencies]
insta = { version = "1.29.0", features = ["yaml"] }
rstest = "0.19.0"

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
